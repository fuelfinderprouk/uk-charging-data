name: Refresh char.gy catalogue
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: charging-catalogue
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect complete official catalogue
        run: python3 Scripts/generate_chargy_catalogue.py --output chargy-locations.json
      - name: Publish validated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chargy-locations.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh char.gy location catalogue'
          git push
